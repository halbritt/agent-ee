name: CI

# Changes are integrated directly on main under the owner's no-PR workflow.
# Consumer projects may call action.yml from any trigger.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Image, strict suite, docs and RC fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      IMAGE: agent-ee:ci
      # The three --security-opt relaxations are required for Bubblewrap inside
      # the container; docs/container.md explains each. No container run needs network.
      SANDBOX_OPTS: >-
        --network none
        --security-opt seccomp=unconfined
        --security-opt apparmor=agent-ee-container
        --security-opt systempaths=unconfined
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Permit container user namespaces with a named AppArmor profile
        run: |
          profile=$(bash scripts/container_apparmor.sh)
          echo "SANDBOX_OPTS=--network none --security-opt seccomp=unconfined --security-opt apparmor=$profile --security-opt systempaths=unconfined" >> "$GITHUB_ENV"

      - name: Build the image from the checkout
        run: docker build -t "$IMAGE" .

      - name: Doctor (native toolchain versions and binary hashes)
        run: |
          docker run --rm $SANDBOX_OPTS "$IMAGE" agent-ee doctor --checks-only

      - name: Probe the production tool sandbox
        run: docker run --rm $SANDBOX_OPTS "$IMAGE" python3 /opt/agent-ee/scripts/check_container_sandbox.py

      - name: Host diagnostics on sandbox setup failure
        if: failure()
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          sudo -n journalctl -k --since '10 minutes ago' --grep='apparmor|RTM_NEWADDR|userns' --no-pager || true

      - name: Full test suite, strict toolchain mode, no skips
        run: |
          docker run --rm $SANDBOX_OPTS -e AGENT_EE_REQUIRE_TOOLCHAIN=1 -e PYTHONPATH=src \
            -w /opt/agent-ee "$IMAGE" python3 -c '
          import sys, unittest
          result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover("tests"))
          if result.skipped:
              print(f"strict CI refuses {len(result.skipped)} skipped test(s)", file=sys.stderr)
          sys.exit(0 if result.wasSuccessful() and not result.skipped else 1)
          '

      - name: Documentation check
        run: docker run --rm --network none -w /opt/agent-ee "$IMAGE" python3 scripts/check_docs.py
      - name: Refuse committed merge-conflict markers
        run: sh scripts/check_conflict_markers.sh

      # Run directories hold copies of the candidate inputs, including third-party
      # design files (the FOME-MC-origin RC fixture and stock KiCad library
      # captures). This public repository's CI judges them in place and uploads
      # no run payload while publication rights for that material are unresolved,
      # so it does not call action.yml, which always uploads the run directory.
      - name: RC control and seeded fixtures, checks-only, judged in place
        run: |
          # GitHub runs bash with -e; review and verify exit statuses are
          # recorded and judged by the gate, not treated as step failures.
          set +e -uo pipefail
          workspace=$(realpath "$GITHUB_WORKSPACE")
          run_image() {
            docker run --rm $SANDBOX_OPTS --user "$(id -u):$(id -g)" -e HOME=/tmp \
              -v "$workspace:$workspace" -w "$workspace" "$IMAGE" "$@"
          }
          # fixture SCOPE OUT GATE-EXPECTATIONS...: review, verify, then judge
          # result.json with the action's gate and append its report to the summary.
          fixture() {
            local scope=$workspace/$1 out=$workspace/$2 summary
            shift 2
            if [ -e "$out" ]; then
              echo "::error::run directory already exists: $out"
              return 1
            fi
            run_image agent-ee review "$scope" --out "$out" --checks-only --max-seconds 900
            local review_exit=$? verify_exit=2
            if [ -f "$out/result.json" ]; then
              run_image agent-ee verify "$out"
              verify_exit=$?
            fi
            echo "review exited $review_exit; verify exited $verify_exit"
            summary=$(mktemp "$RUNNER_TEMP/agent-ee-gate-XXXXXX.md")
            docker run --rm --network none --user "$(id -u):$(id -g)" -e HOME=/tmp \
              -v "$workspace:$workspace" "$IMAGE" python3 /opt/agent-ee/scripts/action_gate.py "$out" \
              --review-exit "$review_exit" --verify-exit "$verify_exit" "$@" > "$summary"
            local gate_exit=$?
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
            head -n 1 "$summary"
            return "$gate_exit"
          }
          status=0
          # Every control check must execute and pass.
          fixture fixtures/rc/control.scope.json build/ci/rc-control --expect checks_passed || status=1
          # The seeded fixture must fail its functional check while every other check executes and passes.
          fixture fixtures/rc/seeded.scope.json build/ci/rc-seeded --expect check_failed \
            --expect-check rc-step=defect --expect-check erc=pass --expect-check drc=pass \
            --expect-check geometry=pass || status=1
          exit "$status"
