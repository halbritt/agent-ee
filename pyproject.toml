[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ee"
version = "0.1.0"
description = "Candidate-bound adversarial PCB and electrical review"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
agent-ee = "agent_ee.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_ee = ["viewer_assets/*", "viewer_assets/vendor/*"]
