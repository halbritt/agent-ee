[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ee"
version = "0.1.0"
description = "Candidate-bound adversarial PCB and electrical review"
requires-python = ">=3.12"
# MIT covers agent-ee material and the owner-approved FOME-MC origins T1 and T2.
# Other third-party files are excluded; see the scope note in LICENSE and
# docs/file-origins.json. The table form is
# what the declared setuptools>=68 floor accepts.
license = {text = "MIT"}
dependencies = []

[project.scripts]
agent-ee = "agent_ee.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_ee = ["viewer_assets/*", "viewer_assets/vendor/*", "data/*"]
