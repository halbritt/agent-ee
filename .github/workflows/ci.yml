name: CI

# Owner direction 2026-11-04 (AGENTEE-614 / Defect #42):
# Full test suite runs locally on proximal nightly (~04:00 Pacific).
# GitHub CI runs zero actual tests, validating only that a recent local
# full strict verdict exists for this exact commit. Completed unchanged commits do not expire.
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

env:
  # Runtime input metadata consumed by ae-ci-exec; retained until its contract changes.
  FOME_MC_COMMIT: 1289f3149d2bcaa83a3b490a0bfbd11ed8a17589
  FOME_MC_STORE: build/external/fome-mc
  J1_DRAWING_URL: https://www.farnell.com/cad/2916153.pdf
  J1_DRAWING_SHA256: 14bd5c3bb2ca16bfcf01918b678eab1aa19df10001c17735dd1f11356a6e4fe8

jobs:
  recency:
    name: Validate local full-suite recency
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check local full-suite recency
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/check_full_suite_recency.py --commit "${{ github.sha }}"
