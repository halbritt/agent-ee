name: CI

# Changes are integrated directly on main under the owner's no-PR workflow.
# Consumer projects may call action.yml from any trigger.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Image, strict suite, docs and RC fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      IMAGE: agent-ee:ci
      # Required external inputs (docs/container.md#required-external-inputs).
      # The public fome-mc repository at this exact commit is the fome-mc object
      # store (tests/toolchain.py FOME_MC_COMMIT). It is read in place, never
      # copied into the image, the repository or an artifact.
      FOME_MC_COMMIT: 1289f3149d2bcaa83a3b490a0bfbd11ed8a17589
      FOME_MC_STORE: build/external/fome-mc
      # The J1 manufacturer drawing (fixtures/telemetry-pod/j1/README.md); its
      # hash is the drawing source hash of j1-placement-exclusion.json.
      J1_DRAWING_URL: https://www.farnell.com/cad/2916153.pdf
      J1_DRAWING_SHA256: 14bd5c3bb2ca16bfcf01918b678eab1aa19df10001c17735dd1f11356a6e4fe8
      # The three --security-opt relaxations are required for Bubblewrap inside
      # the container; docs/container.md explains each. No container run needs network.
      SANDBOX_OPTS: >-
        --network none
        --security-opt seccomp=unconfined
        --security-opt apparmor=agent-ee-container
        --security-opt systempaths=unconfined
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Permit container user namespaces with a named AppArmor profile
        run: |
          profile=$(bash scripts/container_apparmor.sh)
          echo "SANDBOX_OPTS=--network none --security-opt seccomp=unconfined --security-opt apparmor=$profile --security-opt systempaths=unconfined" >> "$GITHUB_ENV"

      - name: Set up Buildx for the hosted layer cache
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver: docker-container
          version: v0.37.1
          driver-opts: image=moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - name: Cache the pinned toolchain stages
        id: toolchain
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        env:
          # Keep build records out of artifacts, like the candidate run payloads.
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          target: toolchain
          push: false
          # Stable scope; BuildKit keys each layer by its instructions, ARGs and
          # COPY inputs. max also retains the routing build stage's apt layer.
          cache-from: type=gha,version=2,scope=agent-ee-native-amd64-v1
          cache-to: type=gha,version=2,scope=agent-ee-native-amd64-v1,mode=max,ignore-error=true

      - name: Build the image from the checkout
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          # Same builder, with warm dependency layers; never export COPY . layers.
          cache-from: type=gha,version=2,scope=agent-ee-native-amd64-v1

      - name: Doctor (native toolchain versions and binary hashes)
        run: |
          docker run --rm $SANDBOX_OPTS "$IMAGE" agent-ee doctor --checks-only

      - name: Probe the production tool sandbox
        run: docker run --rm $SANDBOX_OPTS "$IMAGE" python3 /opt/agent-ee/scripts/check_container_sandbox.py

      - name: Host diagnostics on sandbox setup failure
        if: failure()
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          sudo -n journalctl -k --since '10 minutes ago' --grep='apparmor|RTM_NEWADDR|userns' --no-pager || true

      # Required inputs are acquired here, on the runner, outside the image build,
      # every test process and every tool sandbox; the containers below stay
      # --network none and receive them as read-only mounts.
      # FOME_MC_STORE is under build/, which .gitignore and .dockerignore exclude.
      # A plain anonymous clone: no token, credential helper or extra header, and
      # no global or system Git configuration, so no Authorization header is sent.
      # A missing or private repository fails instead of prompting. Full history
      # and every blob: the suite containers have no network, so a partial clone
      # could not fetch the blobs the tests read.
      - name: Fetch the pinned fome-mc object store (public, no credentials)
        env:
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
        run: |
          set -euo pipefail
          git -c credential.helper= -c http.extraheader= clone --no-checkout https://github.com/halbritt/fome-mc "$FOME_MC_STORE"
          git -C "$FOME_MC_STORE" checkout --quiet --detach "$FOME_MC_COMMIT"

      - name: Verify the fome-mc store is the pinned commit
        run: |
          set -euo pipefail
          head=$(git -C "$FOME_MC_STORE" rev-parse --verify 'HEAD^{commit}')
          if [ "$head" != "$FOME_MC_COMMIT" ]; then
            echo "::error::fome-mc HEAD $head is not the pinned $FOME_MC_COMMIT"
            exit 1
          fi
          if git -C "$FOME_MC_STORE" config --local --get-regexp '^(http\..*\.extraheader|credential\.)' ; then
            echo "::error::credentials persisted in the fome-mc checkout"
            exit 1
          fi
          echo "fome-mc store at $head"

      # Git refuses a repository owned by another user, also inside the tool
      # sandbox where the environment is reset. As on a native host, the store
      # belongs to the user that reads it: the image user, after verification.
      - name: Hand the fome-mc store to the image user
        run: |
          set -euo pipefail
          owner=$(docker run --rm --network none "$IMAGE" sh -c 'echo "$(id -u):$(id -g)"')
          sudo -n chown -R "$owner" "$FOME_MC_STORE"
          echo "fome-mc store owned by $owner"

      - name: Acquire the J1 manufacturer drawing (pinned SHA-256)
        run: |
          set -euo pipefail
          dir=$(mktemp -d "$RUNNER_TEMP/agent-ee-j1.XXXXXX")
          drawing=$dir/te-776228-1.pdf
          # A transport failure, an oversized body or a hash drift fails the job;
          # never replace the expected hash with the downloaded one. The PDF stays
          # outside the checkout and is never committed or uploaded. The distributor
          # stalls requests carrying curl's default User-Agent (0 bytes until the
          # time limit, reproduced 2026-10-19), so a browser-style one is sent; no
          # cookie, token or other credential is.
          curl --fail --silent --show-error --location --proto '=https' --retry 2 \
            --max-time 90 --max-filesize 10000000 --user-agent 'Mozilla/5.0 (X11; Linux x86_64)' \
            "$J1_DRAWING_URL" --output "$drawing"
          printf '%s  %s\n' "$J1_DRAWING_SHA256" "$drawing" | sha256sum --check --strict
          chmod 0444 "$drawing"
          echo "J1_DRAWING=$drawing" >> "$GITHUB_ENV"

      # The required full gate. Every module runs, four at a time, in strict mode;
      # any failure or skip fails the step. A test whose required input is absent
      # fails and is named in the job summary as not executed (docs/container.md).
      # The fome-mc store and the J1 drawing are mounted read-only.
      # AGENT_EE_POD_INPUTS stays unset: the J1 tests use their committed fixtures.
      - name: Full test suite, strict toolchain mode, no skips
        run: |
          summary=$(mktemp -d "$RUNNER_TEMP/agent-ee-suite-XXXXXX")
          chmod 0777 "$summary"
          store=$(realpath "$FOME_MC_STORE")
          status=0
          docker run --rm $SANDBOX_OPTS -e AGENT_EE_REQUIRE_TOOLCHAIN=1 -e PYTHONPATH=src -v "$summary:/summary" \
            -v "$store:/opt/fome-mc:ro" -e AGENT_EE_FOME_MC_CHECKOUT=/opt/fome-mc \
            -v "$J1_DRAWING:/opt/j1/te-776228-1.pdf:ro" -e AGENT_EE_J1_DRAWING=/opt/j1/te-776228-1.pdf \
            -w /opt/agent-ee "$IMAGE" python3 scripts/strict_suite.py --jobs 4 \
            --summary /summary/strict-suite.md || status=$?
          if [ -f "$summary/strict-suite.md" ]; then
            cat "$summary/strict-suite.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::strict suite wrote no summary"
            status=1
          fi
          exit "$status"

      # The checks below also run after a failed suite step so that their own
      # results are reported; any failed step still fails the job.
      - name: Documentation check
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: docker run --rm --network none -w /opt/agent-ee "$IMAGE" python3 scripts/check_docs.py
      - name: Refuse committed merge-conflict markers
        if: ${{ !cancelled() }}
        run: sh scripts/check_conflict_markers.sh

      # Run directories hold copies of the candidate inputs, including third-party
      # design files (the FOME-MC-origin RC fixture and stock KiCad library
      # captures). This public repository's CI judges them in place and uploads
      # no run payload while publication rights for that material are unresolved,
      # so it does not call action.yml, which always uploads the run directory.
      - name: RC control and seeded fixtures, checks-only, judged in place
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          # GitHub runs bash with -e; review and verify exit statuses are
          # recorded and judged by the gate, not treated as step failures.
          set +e -uo pipefail
          workspace=$(realpath "$GITHUB_WORKSPACE")
          run_image() {
            docker run --rm $SANDBOX_OPTS --user "$(id -u):$(id -g)" -e HOME=/tmp \
              -v "$workspace:$workspace" -w "$workspace" "$IMAGE" "$@"
          }
          # fixture SCOPE OUT GATE-EXPECTATIONS...: review, verify, then judge
          # result.json with the action's gate and append its report to the summary.
          fixture() {
            local scope=$workspace/$1 out=$workspace/$2 summary
            shift 2
            if [ -e "$out" ]; then
              echo "::error::run directory already exists: $out"
              return 1
            fi
            run_image agent-ee review "$scope" --out "$out" --checks-only --max-seconds 900
            local review_exit=$? verify_exit=2
            if [ -f "$out/result.json" ]; then
              run_image agent-ee verify "$out"
              verify_exit=$?
            fi
            echo "review exited $review_exit; verify exited $verify_exit"
            summary=$(mktemp "$RUNNER_TEMP/agent-ee-gate-XXXXXX.md")
            docker run --rm --network none --user "$(id -u):$(id -g)" -e HOME=/tmp \
              -v "$workspace:$workspace" "$IMAGE" python3 /opt/agent-ee/scripts/action_gate.py "$out" \
              --review-exit "$review_exit" --verify-exit "$verify_exit" "$@" > "$summary"
            local gate_exit=$?
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
            head -n 1 "$summary"
            return "$gate_exit"
          }
          status=0
          # Every control check must execute and pass.
          fixture fixtures/rc/control.scope.json build/ci/rc-control --expect checks_passed || status=1
          # The seeded fixture must fail its functional check while every other check executes and passes.
          fixture fixtures/rc/seeded.scope.json build/ci/rc-seeded --expect check_failed \
            --expect-check rc-step=defect --expect-check erc=pass --expect-check drc=pass \
            --expect-check geometry=pass || status=1
          exit "$status"
