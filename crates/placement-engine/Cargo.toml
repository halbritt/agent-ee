[package]
name = "agent-ee-placement"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "preserve_order"] }
num-bigint = { version = "0.4", features = ["serde"] }
num-rational = { version = "0.4", features = ["serde", "num-bigint"] }
num-integer = "0.1"
num-traits = "0.2"
sha2 = "0.10"
quick-xml = "0.38"
regex = "1.12"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[[bin]]
name = "agent-ee-placement"
path = "src/main.rs"
